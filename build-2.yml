name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p lib assets android_overrides tools
          if [ -f main.txt ]; then mv main.txt lib/main.dart; else mv main.dart lib/main.dart; fi
          if [ -f pubspec-1.yaml ]; then mv pubspec-1.yaml pubspec.yaml; fi
          mv icon.png icon_fg.png logo.png assets/
          mv AndroidManifest.xml android_overrides/
          mv patch_gradle.py tools/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.musclememory --project-name muscle_memory .
      - run: rm -rf test && cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: python3 tools/patch_gradle.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: muscle-memory-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
